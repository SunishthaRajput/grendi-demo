name: Deploy demo to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check that every product photo loads
        run: |
          for id in $(grep -oE "[0-9]{10,13}-[0-9a-f]{12}" app.js | sort -u); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://images.unsplash.com/photo-$id?w=200")
            echo "$code $id"
          done
      - name: Save photo thumbnails for review
        run: |
          mkdir -p /tmp/thumbs
          for id in $(grep -oE "[0-9]{10,13}-[0-9a-f]{12}" app.js | sort -u); do
            curl -s -o "/tmp/thumbs/$id.jpg" "https://images.unsplash.com/photo-$id?w=240&q=60&auto=format&fm=jpg"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: photo-thumbnails
          path: /tmp/thumbs
          retention-days: 3
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
